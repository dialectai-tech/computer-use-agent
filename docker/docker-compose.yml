version: '3.8'

services:
  browser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cua-browser
    hostname: cua-browser

    environment:
      - DISPLAY=:1
      - DISPLAY_WIDTH=${DISPLAY_WIDTH:-1280}
      - DISPLAY_HEIGHT=${DISPLAY_HEIGHT:-720}

    ports:
      - "${VNC_PORT:-5900}:5900"

    volumes:
      - ../recordings:/recordings
      - ../screenshots:/screenshots
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    shm_size: 2gb

    networks:
      - cua-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "sh", "-c", "DISPLAY=:1 xdpyinfo > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  cua-network:
    driver: bridge
